# touchbinux configuration.
# Default location: /etc/touchbinux/config.toml (or pass --config <file>).
# Reload without restarting: sudo systemctl reload touchbinux
# (or, when started by hand: sudo kill -HUP $(pidof touchbinux))

# Who commands run as when the daemon is NOT started with sudo (e.g. as a systemd
# service). Only honoured if this file is owned by root and not group/world-writable,
# and never root itself. With sudo, SUDO_UID always wins.
# run_as = "ander"

# Layers: the `bar` scene (the one the service runs) shows `default_layer`, or the
# first [[layers]] if it isn't set. Items are placed left to right, `gap` px apart,
# inside a `margin` px border (defaults 12 and 4).
#
# Item types and their fields (anything else is an error):
#   button      id, icon and/or label, action, color   (no label: icon alone, centred)
#               anim_ms                 only with icon = "builtin:folder"
#   clock       id, format (strftime, default "%H:%M"), action
#   battery     id, icon_dir (default /etc/touchbinux/icons), action
#   volume      id, action, color, anim_ms, expand_width, collapse_after_ms
#   brightness  (same as volume)
#   gif         id, path (absolute), play ("on_tap" or "loop"), action
#   spacer      (nothing)             empty space
# Every type also takes `width = <px>` (fixed) or `stretch = <weight>` (a share of
# what is left). Spacers default to stretch = 1, the others to a fixed width.
# Widgets' ids default to their type ("clock", "battery"...); ids must be unique.
# `icon` is an absolute .svg/.png path, an icon theme name, or "builtin:folder".
# `color` ("#rrggbb" or "#rrggbbaa") paints a button's icon in that one colour.
#
# volume and brightness show an icon and the current value. A tap unfolds them into
# a slider over the bar; dragging anywhere on it changes the real level (the finger
# is followed even if it leaves the slider). On the volume slider, a tap on the
# speaker mutes/unmutes. While unfolded the other items don't respond: a touch
# elsewhere just folds it. Options (defaults in brackets):
#   expand_width       width of the unfolded slider, px     [half the bar]
#   collapse_after_ms  fold back after this long untouched  [3000]  (500-60000)
#   anim_ms            unfolding/folding time               [200]   (0-2000)
#   color              filled part of the slider            ["#00ffb7"]
# A gif is scaled once at start to fit its slot (keeping its proportions) and
# centred. play = "on_tap" [default] shows the first frame and plays once per tap
# (no CPU while idle); "loop" plays all the time, so the bar keeps redrawing.
#
# The "builtin:folder" icon opens and closes when tapped: anim_ms is the opening
# time [300]; it stays open half that, then closes. The action fires at once.
# Without `action` a widget's taps only go to the socket. Taps are always reported
# on the socket as well.
#
# Old style: without [[layers]], a list of [[buttons]] (id, label, icon, action)
# forms the default layer, each button an equal share of the bar. The `buttons`
# scene still shows them as before.
#
# Action types:
#   { type = "command", argv = ["prog", "arg", ...], timeout_ms = 5000 }  # no shell
#   { type = "hyprctl", workspace = 2 }                     # or "name:web", "+1"
#   { type = "hyprctl", focus_window = "0xaaab33103270" }   # window address
#   { type = "hyprctl", exec = ["kitty", "-e", "htop"] }     # argv, no shell expansion
#   { type = "hyprctl", raw = 'hl.dsp.focus({ workspace = "e+1" })' }  # literal, advanced
#     (hyprctl actions are written in the syntax of Hyprland's config provider,
#      Lua or classic hyprlang, detected at connection. `raw` is NOT translated:
#      write it for your provider. The old `args = [...]` still works, translated
#      when it is workspace/focuswindow/exec.)
#   { type = "key", key = "KEY_PLAYPAUSE" }                            # virtual keyboard
#   { type = "socket" }                                                # only notify Quickshell
#
# To launch GUI apps prefer `hyprctl` with `exec`: Hyprland starts them, so the
# command's timeout doesn't kill the app.

default_layer = "main"

# [launcher] [wallpaper] ···········  [gif] [hype] [docker] [brightness] [volume] [battery] [clock]
[[layers]]
id = "main"
margin = 4
gap = 12

[[layers.items]]
type = "button"
id = "launcher"
icon = "/etc/touchbinux/icons/arch.svg"
color = "#1793d1"
width = 80
action = { type = "key", key = "KEY_F13" }

# Folder drawn by code; it opens and closes when tapped.
[[layers.items]]
type = "button"
id = "wallpaper"
icon = "builtin:folder"
width = 80
anim_ms = 300
action = { type = "key", key = "KEY_F14" }

[[layers.items]]
type = "spacer"

# 220x220 GIF in a 60 px slot: drawn about 50 px tall, centred.
[[layers.items]]
type = "gif"
path = "/etc/touchbinux/gifs/bongosmash.gif"
width = 60
play = "on_tap"

[[layers.items]]
type = "button"
id = "hype"
icon = "/etc/touchbinux/icons/hype.svg"
width = 80
action = { type = "key", key = "KEY_F15" }

[[layers.items]]
type = "button"
id = "docker"
icon = "/etc/touchbinux/icons/docker-svgrepo-com.svg"
width = 80
action = { type = "key", key = "KEY_F19" }

[[layers.items]]
type = "brightness"
width = 120
expand_width = 1000
collapse_after_ms = 3000
anim_ms = 200
color = "#00ffb7"

[[layers.items]]
type = "volume"
width = 120
expand_width = 1000
collapse_after_ms = 3000
anim_ms = 200
color = "#00ffb7"

# Same command as the XF86Battery bind in hyprland.lua.
[[layers.items]]
type = "battery"
width = 80
action = { type = "command", argv = ["qs", "ipc", "--any-display", "call", "battery", "toggle"] }

# Same command as the XF86Time bind. Redrawn once a minute (every second only if
# the format shows seconds).
[[layers.items]]
type = "clock"
format = "%H:%M"
width = 120
action = { type = "command", argv = ["qs", "ipc", "--any-display", "call", "calendar", "toggle"] }
