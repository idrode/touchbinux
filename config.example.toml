# touchbinux configuration - generic example.
# Installed by install.sh as /etc/touchbinux/config.toml (only if that file doesn't
# exist yet). Full reference of every option: docs/GUIA.md.
#
# Reload after editing:  sudo systemctl reload touchbinux
# If the new file has an error, the daemon keeps the previous configuration and says
# why in the log (journalctl -u touchbinux -e).
#
# It only uses what any installation has: the icons install.sh copies to
# /etc/touchbinux/icons (from this repo's icons/), keys sent through the virtual
# keyboard, and the built-in volume, brightness, battery and clock widgets.

# Who the commands of your buttons run as when the daemon runs as a service. Only
# honoured if this file is owned by root and not writable by group/others, and never
# root itself. install.sh fills it in with your user.
# run_as = "your-user"

default_layer = "main"

#  [esc]  ·····················  [prev] [play] [next]  [brightness] [volume] [battery] [clock]
[[layers]]
id = "main"
margin = 4
gap = 12

# Many Touch Bar MacBooks have no physical Esc key.
[[layers.items]]
type = "button"
id = "esc"
label = "esc"
width = 100
action = { type = "key", key = "KEY_ESC" }

[[layers.items]]
type = "spacer"

# Media keys: they do what your desktop binds XF86AudioPrev/Play/Next to (e.g. a
# `playerctl` bind in Hyprland). Without such binds they do nothing.
[[layers.items]]
type = "button"
id = "prev"
icon = "/etc/touchbinux/icons/fast_rewind.svg"
action = { type = "key", key = "KEY_PREVIOUSSONG" }

[[layers.items]]
type = "button"
id = "play"
icon = "/etc/touchbinux/icons/play_pause.svg"
action = { type = "key", key = "KEY_PLAYPAUSE" }

[[layers.items]]
type = "button"
id = "next"
icon = "/etc/touchbinux/icons/fast_forward.svg"
action = { type = "key", key = "KEY_NEXTSONG" }

# Tap to unfold a slider; drag to change the level. Brightness is the main display's
# backlight (/sys/class/backlight); volume is PipeWire's default sink (wpctl). On the
# volume slider, tapping the speaker mutes/unmutes.
[[layers.items]]
type = "brightness"

[[layers.items]]
type = "volume"

[[layers.items]]
type = "battery"

[[layers.items]]
type = "clock"
format = "%H:%M"

# More examples, commented out (see "Recetas" in docs/GUIA.md):
#
# Open an app through Hyprland (it keeps running after the tap):
# [[layers.items]]
# type = "button"
# id = "terminal"
# icon = "utilities-terminal"          # a name from your icon theme
# action = { type = "hyprctl", exec = ["kitty"] }
#
# Run a command, as run_as, without a shell:
# [[layers.items]]
# type = "button"
# id = "hello"
# label = "Hello"
# action = { type = "command", argv = ["notify-send", "Hello from the Touch Bar"] }
#
# Show what a script sends over the socket (/run/touchbinux.sock):
# [[layers.items]]
# type = "text"
# key = "weather"
# width = 200
