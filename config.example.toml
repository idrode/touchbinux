# Amber text on a dark red pill; on volume/brightness, `color` is the slider fill
# and text_color only the number (add text_color = "#ffcc00" to the items above):
# [[layers.items]]
# type = "button"
# id = "amber"
# label = "F1"
# radius = "full"
# background = "#3a1010"
# text_color = "#ffcc00"
# action = { type = "key", key = "KEY_F1" }
#
# Just the icon, no background:
# [[layers.items]]
# type = "button"
# id = "next-bare"
# icon = "/etc/touchbinux/icons/fast_forward.svg"
# background = "transparent"         # or shape = "none"
# action = { type = "key", key = "KEY_NEXTSONG" }
#
# The clock above as plain text: add `shape = "none"` to it. The battery in a
# circle: add `shape = "circle"` to it.

# A button that unfolds into a row of its children (see "expandable" in
# docs/GUIA.md). Tapping a child runs its action and folds the row; so does
# tapping outside it (without running anything) or leaving it alone for
# collapse_after_ms. A child's id defaults to "<parent id>.<n>" (media.1, ...).
# [[layers.items]]
# type = "expandable"
# id = "media"
# icon = "/etc/touchbinux/icons/play_pause.svg"   # required; also "builtin:folder"
# label = "Media"                  # optional, shown only while folded
# expand_width = 400               # default: just enough for the children
# collapse_after_ms = 3000
# anim_ms = 200
# active_color = "#00ffb750"       # background of children marked active
# close_on_tap = true              # false: tapping a child leaves it open
# pressed_background = "#1793d1"   # a child's highlight while pressed
#
# [[layers.items.children]]
# icon = "/etc/touchbinux/icons/fast_rewind.svg"
# action = { type = "key", key = "KEY_PREVIOUSSONG" }
#
# [[layers.items.children]]
# id = "media_play"
# icon = "/etc/touchbinux/icons/play_pause.svg"
# label = "Play"
# action = { type = "key", key = "KEY_PLAYPAUSE" }
#
# [[layers.items.children]]
# label = "Next"
# action = { type = "key", key = "KEY_NEXTSONG" }
#
# A launcher: a tap runs its action (here F13, for a Quickshell widget bound to
# it); dragging it to the right pulls out a row of terminal apps beside it (the
# circle keeps its shape). The row follows the finger and stays out once the finger
# has gone drag_px to the right; let go before and it goes back in. A move that is
# not a drag to the right (up, down, left, too diagonal) does nothing at all.
# Children are like an expandable's (icon and/or label, action) and may have a box
# of their own (shape, radius, size, background, pressed_background,
# pressed_scale, text_color). detach = true: the app stays open (no timeout, its
# own session; it still ends if the service stops or restarts). Use absolute
# paths: commands run without a shell, with a clean environment (see "Acciones"
# in docs/GUIA.md). Replace /home/USUARIO with your home.
# [[layers.items]]
# type = "button"
# id = "launcher"
# icon = "/etc/touchbinux/icons/arch.svg"   # any icon; this one is not shipped
# color = "#00ffb7"
# shape = "circle"
# size = 52
# background = "transparent"
# action = { type = "key", key = "KEY_F13" }
# drag_px = 24                     # default; 8 to 120
# collapse_after_ms = 4000         # also expand_width, anim_ms, active_color
#
# [[layers.items.drag_children]]
# id = "launcher_kitty"
# icon = "kitty"
# action = { type = "command", argv = ["/usr/bin/kitty", "--directory", "/home/USUARIO"], detach = true }
#
# [[layers.items.drag_children]]
# label = "nvim"
# action = { type = "command", argv = ["/usr/bin/kitty", "--directory", "/home/USUARIO", "-e", "/usr/bin/nvim"], detach = true }
#
# [[layers.items.drag_children]]
# label = "yazi"
# action = { type = "command", argv = ["/usr/bin/kitty", "--directory", "/home/USUARIO", "-e", "/usr/bin/yazi"], detach = true }
#
# [[layers.items.drag_children]]
# label = "htop"
# action = { type = "command", argv = ["/usr/bin/kitty", "--directory", "/home/USUARIO", "-e", "/usr/bin/htop"], detach = true }
#
# [[layers.items.drag_children]]
# label = "claude"
# action = { type = "command", argv = ["/usr/bin/kitty", "--directory", "/home/USUARIO", "-e", "/home/USUARIO/.local/bin/claude"], detach = true }

# A GIF you choose on the bar: tap it to unfold thumbnails of the GIFs in `dir`
# (read again on every tap, as the run_as user); tap one to show it here. The choice
# is kept in /var/lib/touchbinux/state.toml, not in this file. Without the folder or
# without valid GIFs it shows a grey frame and doesn't unfold (not an error).
# [[layers.items]]
# type = "gif_picker"
# dir = "/home/your-user/Pictures/gifs"   # required, absolute
# play = "on_tap"                  # or "always" (redraws all the time: costs CPU)
# width = 80                       # the GIF is fitted to this slot
# thumb_size = 44                  # thumbnails' height, px (default: the row's)
# active_color = "#00ffb750"       # behind the chosen GIF's thumbnail

# Hyprland's workspaces as capsules (needs Hyprland: without it, the item isn't
# drawn and takes no room). style = "dots" (default): inactive, a dot; active, a
# pill dot_size high and active_width long, in active_color. style = "capsule":
# inactive, a horizontal bar; active, the same turned upright. Beside a capsule a strip of its windows' icons
# opens (strip = "active": the active one's; "pressed": under the finger; "all";
# "none"). New workspaces are born out of their neighbour, closed ones merge back.
# Tap a capsule to go to that workspace, an icon to focus that window (sent on
# Hyprland's control socket). Icons: class_icons, then your theme, else an initial.
# [[layers.items]]
# type = "workspaces"
# width = 520                      # the most it takes; what doesn't fit is "+N"
# active_color = "#00ffb7"
# inactive_color = "#ffffff"
# style = "dots"
# dot_size = 26                    # a dot's diameter and the pill's height, 12-48 px
# active_width = 64                # the active pill's length, dot_size-200 px
# active_orientation = "horizontal" # or "vertical": dot_size wide, active_width
# #                                  high (then it must fit in the row)
# # style = "capsule"              # the bars instead (no dot_size, active_width
# # bar_long = 28                  #   nor active_orientation then): axes, px
# # bar_short = 16                 #   (14:8 like the island)
# gap = 8                          # between capsules (default 6 with capsules)
# strip = "active"
# strip_background = "#1a1d1c"
# icon_size = 30
# icon_gap = 10
# strip_pad = 10
# strip_height = 40                # default: the row's height; centred in it
# strip_border_color = "#00ffb7"   # borders inside the outlines (none by default);
# strip_border_width = 2           #   0-6 px, a colour needs a width and vice versa
# bar_border_color = "#808080"
# bar_border_width = 2
# active_border_color = "#ffffff"  # default: bar_border_color
# icon_tint = "#ffffff"            # the strip's icons in one colour
# max_icons = 6
# show = "existing"                # or "all": 1 to 10 even if empty
# class_icons = { "kitty" = "utilities-terminal" }
# overview_action = { type = "key", key = "KEY_F15" }   # a horizontal drag runs it
# drag_px = 24                     # only with overview_action

# mpv's state (it reads it from mpv's IPC socket; it never starts or controls mpv):
# sound bars while playing, a still pause/play glyph otherwise (0 fps). Tapped, it
# unfolds into its children and a seek bar: drag it, mpv jumps when you let go.
# Start mpv with --input-ipc-server=/tmp/mpv-socket. One player at most.
# [[layers.items]]
# type = "player"
# socket = "/tmp/mpv-socket"       # default
# seek_color = "#00ffb7"
# seek_height = 8
# show_time = true                 # current and total time at the bar's ends
# close_on_tap = false             # default: children don't fold it; every tap
#                                  # (and seek) restarts collapse_after_ms
#
# [[layers.items.children]]
# icon = "/etc/touchbinux/icons/play_pause.svg"
# action = { type = "key", key = "KEY_PLAYPAUSE" }
#
# A player's child can have a `role` instead of an action: "prev", "playpause",
# "next" or "stop", sent to mpv over its socket (no process). An explicit `action`
# wins. role = "playpause" may show icon_playing while mpv plays and icon_paused
# otherwise (150 ms cross-fade; `icon` stands in for a missing one). Its box takes
# shape, radius, size (circles, at most the row's height), background,
# pressed_background, pressed_scale and text_color, as a layer's items do.
# [[layers.items.children]]
# role = "playpause"
# icon_playing = "/etc/touchbinux/icons/player_pause.svg"
# icon_paused = "/etc/touchbinux/icons/player_play.svg"
# shape = "circle"
# size = 44
# background = "#00ffb7"
# pressed_background = "#00c98f"
# pressed_scale = 0.92
#
# [[layers.items.children]]
# role = "stop"
# icon = "/etc/touchbinux/icons/player_stop.svg"
# shape = "circle"
# size = 44
# background = "#ff0000"
# pressed_background = "#b30000"

# Screenshots and screen recording with your own scripts (run as run_as, in the
# Wayland session, without a shell). Tapped, it unfolds into: region, window and
# full screenshot (`<screenshot> region|window|full`), record region and record full
# (`<record> region|full`; it must start wf-recorder detached, e.g. `setsid -f`).
# While wf-recorder runs (the session user's) it turns red with a blinking dot and a
# timer; tap it to stop (SIGINT). Modes whose tools are missing (grim, slurp,
# wl-copy, jq, hyprctl, wf-recorder) are greyed out and logged.
# [[layers.items]]
# type = "capture"
# width = 110                      # room for the timer while recording
# screenshot = "/home/your-user/.config/hypr/scripts/screenshot.sh"
# record = "/home/your-user/.config/hypr/scripts/toggle-record.sh"
# color = "#00ffb7"                # the icons
# record_color = "#d92b2b"         # background while recording

# Built-in icons drawn by code: "builtin:folder" (thin outline) and
# "builtin:folder_classic" (filled); both open when their button is tapped.
# "builtin:battery" (buttons only): the system battery drawn by code, filled to
# its level in the level's colour, a bolt while charging, solid full_color when
# full; tapped, the fill empties and refills. Re-read every 30 s while shown.
# [[layers.items]]
# type = "button"
# id = "battery_button"
# icon = "builtin:battery"
# width = 80
# battery_colors = ["#00ffb7", "#ffd60a", "#ff9500", "#ff2d2d"]   # >=60, 30-59, 15-29, <15 %
# full_color = "#00ffff"
# anim_ms = 450
# action = { type = "command", argv = ["qs", "ipc", "--any-display", "call", "battery", "toggle"] }
#
# "builtin:grid_wave": a grid of rounded squares; a diagonal wave runs through it
# when tapped (0 fps otherwise).
# [[layers.items]]
# type = "button"
# id = "wallpaper"
# icon = "builtin:grid_wave"
# color = "#ffffff"                # default
# grid = 3                         # squares per side, 2-4
# anim_ms = 450                    # the wave, default
# width = 80
# action = { type = "key", key = "KEY_F14" }

# More examples, commented out (see "Recetas" in docs/GUIA.md):
#
# Open an app through Hyprland (it keeps running after the tap):
# [[layers.items]]
# type = "button"
# id = "terminal"
# icon = "utilities-terminal"          # a name from your icon theme
# action = { type = "hyprctl", exec = ["kitty"] }
#
# Run a command, as run_as, without a shell:
# [[layers.items]]
# type = "button"
# id = "hello"
# label = "Hello"
# action = { type = "command", argv = ["notify-send", "Hello from the Touch Bar"] }
#
# Show what a script sends over the socket (/run/touchbinux.sock):
# [[layers.items]]
# type = "text"
# key = "weather"
# width = 200
